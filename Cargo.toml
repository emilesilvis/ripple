[package]
name = "ripple"
version = "0.1.0"
edition = "2021"
description = "A tiny simulated world whose gentle soundscapes emerge from a few axiomatic laws."

[dependencies]
cpal = "0.15"
rand = { version = "0.8", features = ["small_rng"] }
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
